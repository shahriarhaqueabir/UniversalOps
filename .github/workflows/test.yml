name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up MSVC for Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci
        shell: bash

      - name: Build frontend (needed for go vet //go:embed)
        run: cd cmd/opsforall-gui/frontend && npm run build
        shell: bash

      - name: Allow ping (setcap CAP_NET_RAW)
        if: runner.os == 'Linux'
        run: sudo setcap cap_net_raw+ep /bin/ping || true

      - name: Vet
        run: go vet ./...
        shell: bash

      - name: Go test
        run: go test -race ./internal/... -coverprofile=coverage.out -covermode=atomic -count=1
        shell: bash

      - name: TypeScript check
        run: cd cmd/opsforall-gui/frontend && npx tsc --noEmit
        shell: bash

      - name: Frontend test
        run: cd cmd/opsforall-gui/frontend && npx vitest run --coverage
        shell: bash

      - name: Lint
        run: cd cmd/opsforall-gui/frontend && npm run lint
        shell: bash

      - name: npm audit
        run: cd cmd/opsforall-gui/frontend && npm audit --audit-level=high
        shell: bash

      - name: govulncheck
        uses: golang/govulncheck-action@v1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out,cmd/opsforall-gui/frontend/coverage/lcov.info
          flags: unittests
          verbose: true
