name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci

      - name: Build frontend
        run: cd cmd/opsforall-gui/frontend && npm run build

      - name: Generate Wails TypeScript bindings
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          wails generate module

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./internal/... -count=1

      - name: TypeScript check
        run: cd cmd/opsforall-gui/frontend && npx tsc --noEmit

      - name: Frontend test
        run: cd cmd/opsforall-gui/frontend && npx vitest run

      - name: Lint
        run: cd cmd/opsforall-gui/frontend && npm run lint

  build-windows:
    timeout-minutes: 30
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci

      - name: Build standalone executable
        run: wails build -platform windows/amd64 -o universal-ops-${{ github.ref_name }}-windows-amd64.exe

      - name: Build NSIS installer
        run: wails build -platform windows/amd64 -nsis -o universal-ops-${{ github.ref_name }}-windows-amd64-installer

      - name: Generate individual checksums
        shell: pwsh
        run: |
          Get-ChildItem build/bin -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: build/bin/*

  publish:
    timeout-minutes: 10
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          echo "## Checksums" > checksums.txt
          sha256sum windows-release/* >> checksums.txt
          cat checksums.txt

      - name: Prepare package manifests
        run: |
          WINDOWS_HASH=$(sha256sum windows-release/*.exe | cut -d' ' -f1)
          echo "Windows SHA256: $WINDOWS_HASH"
          echo "Use these hashes to update scripts/package-scoop.ps1"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksums.txt
            windows-release/*
          generate_release_notes: true
        env:
          # Note: on private repos, the built-in GITHUB_TOKEN cannot create releases.
          # Create a classic PAT with `repo` scope and save it as GH_TOKEN in repo secrets.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
