name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up MSVC for Windows
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - name: Create placeholder for embed
        run: |
          mkdir -p cmd/opsforall-gui/frontend/dist
          touch cmd/opsforall-gui/frontend/dist/index.html
        shell: bash

      - name: Generate Wails TypeScript bindings
        run: wails generate module
        shell: bash

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci
        shell: bash

      - name: Build frontend
        run: cd cmd/opsforall-gui/frontend && npm run build
        shell: bash

      - name: Go vet
        run: go vet ./...
        shell: bash

      - name: Go test
        run: go test ./internal/... -count=1
        shell: bash

      - name: TypeScript check
        run: cd cmd/opsforall-gui/frontend && npx tsc --noEmit
        shell: bash

      - name: Frontend test
        run: cd cmd/opsforall-gui/frontend && npx vitest run
        shell: bash

  build-windows:
    timeout-minutes: 45
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up MSVC for Windows
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci
        shell: bash

      - name: Build standalone executable
        run: wails build -platform windows/amd64 -o universal-ops-${{ github.ref_name }}-windows-amd64.exe
        shell: bash

      - name: Build NSIS installer
        run: wails build -platform windows/amd64 -nsis -o universal-ops-${{ github.ref_name }}-windows-amd64-installer
        shell: bash

      - name: Generate individual checksums
        shell: pwsh
        run: |
          Get-ChildItem build/bin -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/bin/*

  publish:
    timeout-minutes: 15
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release

      - name: Generate checksums
        run: |
          echo "## Checksums" > checksums.txt
          sha256sum windows-release/* >> checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksums.txt
            windows-release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
