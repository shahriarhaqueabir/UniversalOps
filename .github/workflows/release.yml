name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up MSVC for Windows
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install Wails CLI (pinned to v2 — matches go.mod; @latest drifts to v3)
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - name: Create placeholder for embed
        run: |
          mkdir -p cmd/opsforall-gui/frontend/dist
          touch cmd/opsforall-gui/frontend/dist/index.html
        shell: bash

      - name: Generate Wails TypeScript bindings
        run: wails generate module
        shell: bash

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci
        shell: bash

      - name: Build frontend
        run: cd cmd/opsforall-gui/frontend && npm run build
        shell: bash

      - name: Go vet
        run: go vet ./...
        shell: bash

      - name: Go test
        run: go test ./internal/... -count=1
        shell: bash

      - name: TypeScript check
        # tsc -b (build mode) — the root tsconfig is project-references only, so
        # plain `tsc --noEmit` type-checks nothing. -b matches `npm run build`.
        run: cd cmd/opsforall-gui/frontend && npx tsc -b
        shell: bash

      - name: Frontend test
        run: cd cmd/opsforall-gui/frontend && npx vitest run
        shell: bash

  build-windows:
    timeout-minutes: 45
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up MSVC for Windows
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        run: choco install nsis -y
        shell: powershell

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install Wails CLI (pinned to v2 — matches go.mod; @latest drifts to v3)
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci
        shell: bash

      - name: Compute release version (strip leading v from git tag)
        # NOTE: use a direct string write to GITHUB_OUTPUT. `Write-Host ... >>
        # $env:GITHUB_OUTPUT` silently writes NOTHING (information stream vs
        # success stream), which left steps.ver.outputs.ver empty and produced
        # universal-ops--windows-amd64.exe (double dash) in release run 30651957345.
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          "VER=$ver" >> $env:GITHUB_OUTPUT

      - name: Build standalone executable and installer
        # Builds both the .exe and the NSIS installer.
        # Note: --nsis is only available on Windows build hosts.
        run: wails build -platform windows/amd64 -nsis -o universal-ops-${{ steps.ver.outputs.ver }}-windows-amd64.exe
        shell: bash

      - name: Generate individual checksums
        shell: pwsh
        run: |
          Get-ChildItem build/bin -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/bin/*

  publish:
    permissions:
      contents: write
    timeout-minutes: 15
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: windows-release

      - name: Compute version and SHA256
        # Same GITHUB_OUTPUT trap as build-windows: Write-Host writes to the
        # information stream and `>>` captures nothing. Use direct string writes
        # so steps.ver.outputs.sha256 actually reaches package-scoop.ps1.
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $files = (Get-ChildItem "windows-release" -File | Select-Object -ExpandProperty Name) -join ", "
          $exe = Get-ChildItem "windows-release" -Filter "universal-ops-$ver-windows-amd64.exe" | Select-Object -First 1
          if (-not $exe) { throw "Expected artifact universal-ops-$ver-windows-amd64.exe not found. Actual artifact contents: $files" }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "VER=$ver" >> $env:GITHUB_OUTPUT
          "SHA256=$sha" >> $env:GITHUB_OUTPUT

      - name: Generate Scoop manifest (real hash injected)
        shell: pwsh
        run: |
          & scripts/package-scoop.ps1 -Version "${{ github.ref_name }}" -Sha256 "${{ steps.ver.outputs.sha256 }}"

      - name: Generate checksums (release assets only — skip .sha256 sidecars)
        run: |
          find windows-release -type f ! -name '*.sha256' -exec sha256sum {} + > checksums.txt
          cat checksums.txt

      - name: Create release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "UniversalOps ${{ github.ref_name }}" \
            --generate-notes \
            windows-release/* checksums.txt universal-ops.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
