name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci

      - name: Build frontend
        run: cd cmd/opsforall-gui/frontend && npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./internal/... -count=1

      - name: TypeScript check
        run: cd cmd/opsforall-gui/frontend && npx tsc --noEmit

      - name: Frontend test
        run: cd cmd/opsforall-gui/frontend && npx vitest run

      - name: Lint
        run: cd cmd/opsforall-gui/frontend && npm run lint

  build-windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci

      - name: Build standalone executable
        run: wails build -platform windows/amd64 -o opsforall-${{ github.ref_name }}-windows-amd64.exe

      - name: Build NSIS installer
        run: wails build -platform windows/amd64 -nsis -o opsforall-${{ github.ref_name }}-windows-amd64-installer

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/bin/*

  build-linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci

      - name: Build
        run: wails build -platform linux/amd64 -o opsforall-${{ github.ref_name }}-linux-amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/bin/*

  build-macos:
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cmd/opsforall-gui/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd cmd/opsforall-gui/frontend && npm ci

      - name: Build (universal binary)
        run: wails build -platform darwin/universal -o opsforall-${{ github.ref_name }}-darwin-universal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/bin/*

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-release/*
            linux-release/*
            macos-release/*
          generate_release_notes: true
        env:
          # Note: on private repos, the built-in GITHUB_TOKEN cannot create releases.
          # Create a classic PAT with `repo` scope and save it as GH_TOKEN in repo secrets.
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
