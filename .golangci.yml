# golangci-lint configuration for Universal-Ops
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m
  tests: true
  # Exclude third-party code and helper scripts from analysis
  skip-dirs:
    - node_modules
    - scripts
    - vendor

linters:
  disable-all: true
  enable:
    # High-signal defaults
    - errcheck       # detect unchecked errors
    - govet          # go vet
    - staticcheck    # extensive static analysis
    - gosimple       # simplify code
    - unused         # detect unused code
    - ineffassign    # detect ineffective assignments

    # Additional useful checks
    - errorlint      # error wrapping ( %w vs %s )
    - revive         # replacement for golint
    - bodyclose      # ensure HTTP response bodies are closed
    - prealloc        # pre-allocate slices when size is known
    - gocritic        # lint checks from Go team
    - misspell        # detect common typos

linters-settings:
  errcheck:
    check-type-assertions: true
    # Allow explicit ignore with '_' to reduce noise
    check-blank: false
  revive:
    # Disable strict naming for WMI structs (which use underscores)
    rules:
      - name: var-naming
        disabled: true
  gocritic:
    enabled-tags:
      - performance
      - diagnostic
      - style
    disabled-checks:
      - octalLiteral # allow 0644 style
      - hugeParam    # don't worry about large structs for now
      - rangeValCopy # don't worry about large range copies for now

issues:
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - errcheck
        - gosec
    - path: internal/common/
      text: "ST1003"  # allow common package naming quirks
