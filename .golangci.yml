# golangci-lint configuration for UniversalOps (Pragmatic Edition)
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m
  tests: true

linters:
  disable-all: true
  enable:
    # Critical checks
    - govet          # go vet
    - staticcheck    # extensive static analysis
    - unused         # detect unused code
    - typecheck      # like go build

    # Useful but less noisy
    - bodyclose      # ensure HTTP response bodies are closed
    - misspell        # detect common typos

linters-settings:
  staticcheck:
    # Disable SA1019 (deprecated) to reduce noise
    checks: ["all", "-SA1019"]

  unused:
    # Don't be too aggressive about unused constants or types
    check-exported: false

issues:
  max-same-issues: 0
  exclude-dirs:
    - node_modules
    - scripts
    - vendor
    - build
    - data
  
  exclude-rules:
    # Ignore ST1003 (deprecated identifier naming) from staticcheck
    - linters: [staticcheck]
      text: "ST1003"
    # Unused functions in SecOps facade — reserved for future use
    - linters: [unused]
      path: internal/app/SecOps.go
    # SA4006: err never used in sandbox profile (syscall noise)
    - linters: [staticcheck]
      path: internal/common/sandbox_profile_windows.go
      text: "SA4006"
    # SA9003: empty branch in wifi.go (intentional placeholder)
    - linters: [staticcheck]
      path: internal/netops/wifi.go
      text: "SA9003"
    # SA4006: unused values in test helpers (intentional zero-value checks)
    - linters: [staticcheck]
      path: _test\.go
      text: "SA4006"
    # Allow some common patterns in tests
    - path: _test\.go
      linters:
        - unused
    # Ignore errors in the autogenerated wailsjs folder
    - path: cmd/opsforall-gui/frontend/wailsjs/
      linters:
        - staticcheck
