# golangci-lint configuration for Universal-Ops (Pragmatic Edition)
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m
  tests: true
  # Using skip-dirs for compatibility, ignoring deprecation warning for now
  skip-dirs:
    - node_modules
    - scripts
    - vendor
    - build
    - data

linters:
  disable-all: true
  enable:
    # Critical checks
    - errcheck       # detect unchecked errors
    - govet          # go vet
    - staticcheck    # extensive static analysis
    - unused         # detect unused code
    - ineffassign    # detect ineffective assignments
    - typecheck      # like go build

    # Useful but less noisy
    - errorlint      # error wrapping ( %w vs %s )
    - bodyclose      # ensure HTTP response bodies are closed
    - misspell        # detect common typos

linters-settings:
  errcheck:
    # Don't report errors that are explicitly ignored with `_ = ...`
    check-blank: false
    check-type-assertions: false
  
  staticcheck:
    # Disable SA1019 (deprecated) to reduce noise
    checks: ["all", "-SA1019"]

  unused:
    # Don't be too aggressive about unused constants or types
    check-exported: false

issues:
  max-same-issues: 0
  
  exclude-rules:
    # Ignore "var-naming" and "hugeParam" noise from gocritic/revive (if enabled)
    - text: "ST1003"
    - text: "var-naming"
    - text: "hugeParam"
    # Allow some common patterns in tests
    - path: _test\.go
      linters:
        - errcheck
        - errorlint
    # Ignore errors in the autogenerated wailsjs folder
    - path: cmd/opsforall-gui/frontend/wailsjs/
      linters:
        - errcheck
        - staticcheck
